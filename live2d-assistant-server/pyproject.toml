[project]
name = "live2d-assistant-server"
version = "0.1.0"
description = "Live2D Assistant Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "python-dotenv",
    "fastapi[standard]",
    "uvicorn",
    "pydantic",
    "requests",
    "agentic-agents",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[tool.uv.sources]
agentic-agents = { path = "external/agentic-agent" }

[tool.setuptools.packages.find]
include = ["live2d_server*"]
